<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>多功能讀書計畫管理系統</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    .calendar-day { min-height: 80px; }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 font-sans min-h-screen">

  <header class="bg-indigo-600 text-white p-4 shadow-md">
    <div class="max-w-7xl mx-auto flex justify-between items-center">
      <h1 class="text-2xl font-bold flex items-center gap-2">
        <i class="fa-solid fa-graduation-cap"></i> 多功能讀書計畫系統
      </h1>
      <span class="text-sm bg-indigo-500 px-3 py-1 rounded-full" id="currentDateDisplay"></span>
    </div>
  </header>

  <main class="max-w-7xl mx-auto p-4 md:p-6 grid grid-cols-1 lg:grid-cols-3 gap-6">

    <div class="lg:col-span-1 space-y-6">
      
      <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-200">
        <h2 class="text-lg font-bold mb-4 text-indigo-600 flex items-center gap-2">
          <i class="fa-solid fa-plus-circle"></i> 新增學習任務
        </h2>
        <form id="taskForm" class="space-y-4">
          <div>
            <label class="block text-sm font-medium mb-1">科目 / 任務名稱</label>
            <input type="text" id="subjectName" placeholder="例如：英文文法、數學第三章" class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none" required>
          </div>
          <div>
            <label class="block text-sm font-medium mb-1">預定完成日期與時間</label>
            <input type="datetime-local" id="dueDate" class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none" required>
          </div>
          <div>
            <label class="block text-sm font-medium mb-1">備註說明（選填）</label>
            <textarea id="taskNote" rows="2" placeholder="備註學習重點或範圍..." class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none"></textarea>
          </div>
          <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2 rounded-lg transition">
            新增至計畫
          </button>
        </form>
      </div>

      <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-200">
        <h2 class="text-lg font-bold mb-3 text-indigo-600 flex items-center gap-2">
          <i class="fa-solid fa-layer-group"></i> 目標分類與提醒
        </h2>
        
        <div class="flex border-b border-slate-200 mb-4">
          <button onclick="switchTab('short')" id="tab-short" class="flex-1 py-2 text-center font-medium border-b-2 border-indigo-600 text-indigo-600">短期 (&lt;7天)</button>
          <button onclick="switchTab('mid')" id="tab-mid" class="flex-1 py-2 text-center font-medium text-slate-500">中期 (&lt;30天)</button>
          <button onclick="switchTab('long')" id="tab-long" class="flex-1 py-2 text-center font-medium text-slate-500">長期 (&gt;30天)</button>
        </div>

        <div id="taskList" class="space-y-3 max-h-80 overflow-y-auto pr-1">
          </div>
      </div>

    </div>

    <div class="lg:col-span-2 space-y-6">

      <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-200">
        <div class="flex justify-between items-center mb-4">
          <h2 class="text-lg font-bold text-indigo-600 flex items-center gap-2">
            <i class="fa-regular fa-calendar-days"></i> 預定完成時間月曆
          </h2>
          <div class="flex items-center gap-2">
            <button onclick="changeMonth(-1)" class="p-1 hover:bg-slate-100 rounded-full"><i class="fa-solid fa-chevron-left"></i></button>
            <span id="calendarMonthYear" class="font-bold text-lg"></span>
            <button onclick="changeMonth(1)" class="p-1 hover:bg-slate-100 rounded-full"><i class="fa-solid fa-chevron-right"></i></button>
          </div>
        </div>

        <div class="grid grid-cols-7 gap-1 text-center font-bold text-slate-500 text-sm mb-2">
          <div>日</div><div>一</div><div>二</div><div>三</div><div>四</div><div>五</div><div>六</div>
        </div>
        <div id="calendarGrid" class="grid grid-cols-7 gap-1">
          </div>
      </div>

      <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-200">
        <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 mb-4">
          <div>
            <h2 class="text-lg font-bold text-indigo-600 flex items-center gap-2">
              <i class="fa-regular fa-clock"></i> 每日 1 小時進度追蹤
            </h2>
            <p class="text-sm text-slate-500">安排當天各時段的讀書進度並進行追蹤</p>
          </div>
          <div class="w-full md:w-48 bg-slate-100 p-2 rounded-lg border">
            <div class="flex justify-between text-xs mb-1 font-bold">
              <span>今日完成率</span>
              <span id="dailyProgressPercent">0%</span>
            </div>
            <div class="w-full bg-slate-200 h-2.5 rounded-full overflow-hidden">
              <div id="dailyProgressBar" class="bg-green-500 h-2.5 rounded-full transition-all duration-300" style="width: 0%"></div>
            </div>
          </div>
        </div>

        <div id="hourlySchedule" class="space-y-2 max-h-96 overflow-y-auto pr-1">
          </div>
      </div>

    </div>

  </main>

  <script>
    // 初始化資料庫
    let tasks = JSON.parse(localStorage.getItem('study_tasks')) || [];
    let hourlyData = JSON.parse(localStorage.getItem('study_hourly')) || {};
    let currentTab = 'short';
    let currentDate = new Date();

    // 初始化頁面
    document.addEventListener('DOMContentLoaded', () => {
      document.getElementById('currentDateDisplay').textContent = new Date().toLocaleDateString('zh-TW');
      renderTasks();
      renderCalendar();
      renderHourlySchedule();

      document.getElementById('taskForm').addEventListener('submit', handleAddTask);
    });

    // 新增任務處理
    function handleAddTask(e) {
      e.preventDefault();
      const subject = document.getElementById('subjectName').value;
      const dueDate = document.getElementById('dueDate').value;
      const note = document.getElementById('taskNote').value;

      const newTask = {
        id: Date.now(),
        subject,
        dueDate,
        note,
        completed: false
      };

      tasks.push(newTask);
      localStorage.setItem('study_tasks', JSON.stringify(tasks));

      document.getElementById('taskForm').reset();
      renderTasks();
      renderCalendar();
    }

    // 計算天數差並區分長中短期
    function getTaskCategory(dueDateStr) {
      const now = new Date();
      const due = new Date(dueDateStr);
      const diffTime = due - now;
      const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));

      if (diffDays <= 7) return 'short';
      if (diffDays <= 30) return 'mid';
      return 'long';
    }

    // 切換長中短期 Tab
    function switchTab(type) {
      currentTab = type;
      ['short', 'mid', 'long'].forEach(t => {
        const btn = document.getElementById(`tab-${t}`);
        if (t === type) {
          btn.className = "flex-1 py-2 text-center font-medium border-b-2 border-indigo-600 text-indigo-600";
        } else {
          btn.className = "flex-1 py-2 text-center font-medium text-slate-500";
        }
      });
      renderTasks();
    }

    // 渲染任務列表
    function renderTasks() {
      const taskList = document.getElementById('taskList');
      taskList.innerHTML = '';

      const filteredTasks = tasks.filter(task => getTaskCategory(task.dueDate) === currentTab);

      if (filteredTasks.length === 0) {
        taskList.innerHTML = `<p class="text-slate-400 text-center py-4">此分類目前無任務</p>`;
        return;
      }

      filteredTasks.forEach(task => {
        const div = document.createElement('div');
        div.className = "p-3 bg-slate-50 rounded-lg border border-slate-200 flex justify-between items-start";
        div.innerHTML = `
          <div>
            <div class="font-bold text-slate-800">${task.subject}</div>
            <div class="text-xs text-indigo-600 mt-1"><i class="fa-regular fa-clock"></i> 截止：${task.dueDate.replace('T', ' ')}</div>
            ${task.note ? `<div class="text-xs text-slate-500 mt-1">${task.note}</div>` : ''}
          </div>
          <button onclick="deleteTask(${task.id})" class="text-red-400 hover:text-red-600 text-sm">
            <i class="fa-solid fa-trash"></i>
          </button>
        `;
        taskList.appendChild(div);
      });
    }

    // 刪除任務
    function deleteTask(id) {
      tasks = tasks.filter(t => t.id !== id);
      localStorage.setItem('study_tasks', JSON.stringify(tasks));
      renderTasks();
      renderCalendar();
    }

    // 渲染月曆
    function renderCalendar() {
      const calendarGrid = document.getElementById('calendarGrid');
      const calendarMonthYear = document.getElementById('calendarMonthYear');
      calendarGrid.innerHTML = '';

      const year = currentDate.getFullYear();
      const month = currentDate.getMonth();

      calendarMonthYear.textContent = `${year} 年 ${month + 1} 月`;

      const firstDay = new Date(year, month, 1).getDay();
      const daysInMonth = new Date(year, month + 1, 0).getDate();

      // 補白格
      for (let i = 0; i < firstDay; i++) {
        const emptyCell = document.createElement('div');
        emptyCell.className = "calendar-day bg-slate-50/50 rounded-lg border border-transparent";
        calendarGrid.appendChild(emptyCell);
      }

      // 渲染日期
      for (let day = 1; day <= daysInMonth; day++) {
        const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
        const dayTasks = tasks.filter(t => t.dueDate.startsWith(dateStr));

        const dayCell = document.createElement('div');
        dayCell.className = "calendar-day p-1 bg-white border border-slate-200 rounded-lg text-xs overflow-hidden";
        
        let taskBadges = dayTasks.map(t => `<div class="bg-indigo-100 text-indigo-700 px-1 rounded truncate mt-1" title="${t.subject}">${t.subject}</div>`).join('');

        dayCell.innerHTML = `
          <div class="font-bold text-slate-700">${day}</div>
          <div class="space-y-0.5">${taskBadges}</div>
        `;
        calendarGrid.appendChild(dayCell);
      }
    }

    function changeMonth(delta) {
      currentDate.setMonth(currentDate.getMonth() + delta);
      renderCalendar();
    }

    // 渲染 24 小時時段表
    function renderHourlySchedule() {
      const container = document.getElementById('hourlySchedule');
      container.innerHTML = '';

      const todayStr = new Date().toISOString().split('T')[0];
      if (!hourlyData[todayStr]) {
        hourlyData[todayStr] = Array(24).fill({ content: '', status: 'none' });
      }

      let completedCount = 0;
      let totalPlannedCount = 0;

      for (let hour = 0; hour < 24; hour++) {
        const hourLabel = `${String(hour).padStart(2, '0')}:00 - ${String(hour + 1).padStart(2, '0')}:00`;
        const item = hourlyData[todayStr][hour] || { content: '', status: 'none' };

        if (item.content.trim() !== '') totalPlannedCount++;
        if (item.status === 'done') completedCount++;

        const div = document.createElement('div');
        div.className = "flex items-center gap-2 text-sm";
        div.innerHTML = `
          <span class="w-28 text-slate-500 font-mono text-xs">${hourLabel}</span>
          <input type="text" value="${item.content || ''}" onchange="updateHourlyContent(${hour}, this.value)" placeholder="點擊填寫預計讀書項目..." class="flex-1 px-2 py-1 border rounded focus:ring-1 focus:ring-indigo-500 outline-none">
          <select onchange="updateHourlyStatus(${hour}, this.value)" class="px-2 py-1 border rounded bg-slate-50 text-xs">
            <option value="none" ${item.status === 'none' ? 'selected' : ''}>未完成</option>
            <option value="doing" ${item.status === 'doing' ? 'selected' : ''}>進行中</option>
            <option value="done" ${item.status === 'done' ? 'selected' : ''}>已完成</option>
          </select>
        `;
        container.appendChild(div);
      }

      // 更新進度條
      const percent = totalPlannedCount > 0 ? Math.round((completedCount / totalPlannedCount) * 100) : 0;
      document.getElementById('dailyProgressBar').style.width = `${percent}%`;
      document.getElementById('dailyProgressPercent').textContent = `${percent}%`;
    }

    function updateHourlyContent(hour, val) {
      const todayStr = new Date().toISOString().split('T')[0];
      if (!hourlyData[todayStr]) hourlyData[todayStr] = Array(24).fill({ content: '', status: 'none' });
      hourlyData[todayStr][hour] = { ...hourlyData[todayStr][hour], content: val };
      localStorage.setItem('study_hourly', JSON.stringify(hourlyData));
      renderHourlySchedule();
    }

    function updateHourlyStatus(hour, status) {
      const todayStr = new Date().toISOString().split('T')[0];
      if (!hourlyData[todayStr]) hourlyData[todayStr] = Array(24).fill({ content: '', status: 'none' });
      hourlyData[todayStr][hour] = { ...hourlyData[todayStr][hour], status: status };
      localStorage.setItem('study_hourly', JSON.stringify(hourlyData));
      renderHourlySchedule();
    }
  </script>
</body>
</html>
